<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Guru BK — AI Rekomendasi Karier SMK Telkom</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* Abstract background blur elements */
    .bg-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(21, 88, 167, 0.4) 0%, rgba(21, 88, 167, 0) 70%);
      filter: blur(40px);
      z-index: 1;
    }
    .glow-1 { top: -100px; left: -100px; }
    .glow-2 { bottom: -100px; right: -100px; }

    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: var(--space-4);
    }

    .login-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-lg);
      padding: var(--space-8);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      transition: background-color var(--transition-normal);
    }

    [data-theme="dark"] .login-card {
      background: rgba(21, 28, 44, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--space-6);
    }

    .login-logo {
      width: 65px;
      height: 65px;
      margin: 0 auto var(--space-4) auto;
      border-radius: var(--radius-md);
      background: white;
      padding: 6px;
      box-shadow: var(--shadow-md);
    }

    .login-logo svg {
      width: 100%;
      height: 100%;
    }

    .login-title {
      font-size: var(--text-2xl);
      font-weight: 700;
      margin-bottom: var(--space-1);
    }

    .login-subtitle {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    .form-group {
      margin-bottom: var(--space-4);
    }

    .form-control {
      background: rgba(255, 255, 255, 0.7);
    }

    [data-theme="dark"] .form-control {
      background: rgba(15, 23, 42, 0.6);
    }

    .error-panel {
      background-color: var(--color-danger-light);
      color: var(--color-danger);
      border: 1px solid rgba(198, 40, 40, 0.2);
      padding: var(--space-3);
      border-radius: var(--radius-sm);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
      display: none;
      align-items: center;
      gap: var(--space-2);
      font-weight: 500;
    }

    .btn-login {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      background-color: var(--color-primary);
      border: none;
      color: white;
      border-radius: var(--radius-md);
      font-size: var(--text-base);
      font-weight: 600;
      margin-top: var(--space-4);
      box-shadow: 0 4px 6px -1px rgba(21, 88, 167, 0.4);
    }

    .btn-login:hover {
      background-color: var(--color-primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 8px -1px rgba(21, 88, 167, 0.5);
    }

    .login-footer-info {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }
  </style>
</head>
<body>

  <!-- Background vector glows -->
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="#D32F2F"/>
            <path d="M30 30H70V38H54V70H46V38H30V30Z" fill="white"/>
            <rect x="50" y="38" width="8" height="32" fill="#E57373"/>
          </svg>
        </div>
        <h2 class="login-title">Dashboard Guru BK</h2>
        <p class="login-subtitle">AI Rekomendasi Karier SMK Telkom</p>
      </div>

      <div class="error-panel" id="error-message">
        <svg style="width:16px;height:16px;flex-shrink:0;" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v5z"/>
        </svg>
        <span id="error-text">Username atau password salah</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" type="text" id="username" placeholder="Masukkan username Anda" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" placeholder="Masukkan password Anda" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-login">Masuk ke Dashboard</button>
      </form>

      <div class="login-footer-info">
        <span>Gunakan akun BK resmi sekolah Anda.<br>SMK Telkom Malang © 2026</span>
      </div>
    </div>
  </div>

  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
